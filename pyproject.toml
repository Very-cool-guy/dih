[project] # i added every field on the guide lol.
name = "dih"
version = "0"
description = "The dih programming language"
keywords = ["language", "graph"]
readme = "README.md"
authors = [
    {name = "Lucas Cutecat"}
]
license = "WTFPL"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Topic :: Software Development :: Interpreters"
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
gui = [
    "pyqt6>=6.11.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-dih",
]

[project.urls]
Repository = "https://github.com/Very-cool-guy/dih.git"

[project.scripts]
dih = "dih.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "tree-sitter-dih",
]

[tool.uv.sources]
tree-sitter-dih = { workspace = true, editable = true }
